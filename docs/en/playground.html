<h1>Playground</h1>
<p class="lead">Run planck code in the browser.</p>
<div id="playground">
<p><select id="pg-mode" aria-label="mode">
<option value="repl">Show as a REPL session</option>
<option value="run">Run as a program</option>
</select></p>
<textarea id="pg-src" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">fib(n) := if (n &lt; 2) n else fib(n - 1) + fib(n - 2)
fib(20)
put("Hello, world!\n")
</textarea>
<p><button type="button" id="pg-run" class="run">Run</button></p>
<p class="label">Output</p>
<pre class="out" id="pg-out"></pre>
</div>
