<label>サンプル <select id="pg-sample">
<option value="">選んで読み込む</option>
<optgroup label="1. 式・束縛・関数">
<option value="t1_hello" data-src="put(&quot;Hello, world!\n&quot;)">t1_hello.pk</option>
<option value="t1_vars" data-src="x := 10
y := x * 2
println(y)
x = x + 1
println(x)">t1_vars.pk</option>
<option value="t1_func" data-src="square(n) := n * n
println(square(12))

add3(a, b, c) := a + b + c
println(add3(1, 2, 3))

twice := f -&gt; x -&gt; f(f(x))
println(twice(square)(3))">t1_func.pk</option>
<option value="t1_rec" data-src="fact(n) := if (n == 0) 1 else n * fact(n - 1)
println(fact(10))

make_counter() := {
    n := 0
    () -&gt; { n = n + 1; n }
}
c := make_counter()
c(); c()
println(c())">t1_rec.pk</option>
</optgroup>
<optgroup label="2. 値と M式">
<option value="t2_mexpr" data-src="p := Point{3, 4}
println(p)
println(head(p))
println(arity(p))
println(arg(p, 1))
println(Point{1, 2} == Point{1, 2})
println(push(p, 5))">t2_mexpr.pk</option>
<option value="t2_lists" data-src="xs := [1, 2, 3]
println(xs)
ys := 0 :: xs
println(ys)

use(&quot;pretty&quot;)
put(f&quot;{ys}\n&quot;)

println(())
println((1, &quot;a&quot;))">t2_lists.pk</option>
</optgroup>
<optgroup label="3. パターンと融合">
<option value="t3_fib" data-src="fun fib
fib = (0) -&gt; 0
     | (1) -&gt; 1
     | (n) -&gt; fib(n - 1) + fib(n - 2)
println(fib(20))">t3_fib.pk</option>
<option value="t3_fib_lines" data-src="fib(0) := 0
fib(1) = 1
fib(n) = fib(n - 1) + fib(n - 2)
println(fib(20))">t3_fib_lines.pk</option>
<option value="t3_list" data-src="fun len
len = (Nil{}) -&gt; 0 | (_ :: xs) -&gt; 1 + len(xs)
println(len([5, 6, 7]))

fun sum
sum = ([]) -&gt; 0 | (x :: xs) -&gt; x + sum(xs)
println(sum([1, 2, 3, 4]))

swap2 := ([a, b]) -&gt; [b, a] | (xs) -&gt; xs
use(&quot;pretty&quot;)
put(f&quot;{swap2([1, 2])} {swap2([1, 2, 3])}\n&quot;)">t3_list.pk</option>
<option value="t3_extend" data-src="greet := (_) -&gt; &quot;hello&quot;
put(greet(&quot;en&quot;)); put(&quot;\n&quot;)

greet = (&quot;fr&quot;) -&gt; &quot;bonjour&quot; | greet
put(greet(&quot;fr&quot;)); put(&quot;\n&quot;)
put(greet(&quot;de&quot;)); put(&quot;\n&quot;)">t3_extend.pk</option>
<option value="t3_match" data-src="classify(n) := match n {
    0 -&gt; &quot;zero&quot;
  | n if n &lt; 0 -&gt; &quot;negative&quot;
  | n if n % 2 == 0 -&gt; &quot;even&quot;
  | _ -&gt; &quot;odd&quot;
}
put(classify(0)); put(&quot; &quot;)
put(classify(-4)); put(&quot; &quot;)
put(classify(6)); put(&quot; &quot;)
put(classify(7)); put(&quot;\n&quot;)">t3_match.pk</option>
<option value="t3_deriv" data-src="fun d
d = (n @ Int, x) -&gt; 0
   | (y @ Symbol, x) -&gt; if (y == x) 1 else 0
   | (Add{a, b}, x) -&gt; Add{d(a, x), d(b, x)}
   | (Mul{a, b}, x) -&gt; Add{Mul{d(a, x), b}, Mul{a, d(b, x)}}

println(d(&#x27;Add{x, 3}, &#x27;x))
println(d(&#x27;Mul{x, y}, &#x27;x))">t3_deriv.pk</option>
</optgroup>
<optgroup label="4. ライブラリ">
<option value="t4_list" data-src="use(&quot;list&quot;)
use(&quot;pretty&quot;)
xs := range(1, 11)
put(f&quot;{xs}\n&quot;)
put(f&quot;{map(x -&gt; x * x, xs)}\n&quot;)
put(f&quot;{filter(x -&gt; x % 2 == 0, xs)}\n&quot;)
println(foldl((a, b) -&gt; a + b, 0, xs))
put(f&quot;{list.sort((a, b) -&gt; a &lt; b, [5, 3, 9, 1])}\n&quot;)
put(f&quot;{list.zip([1, 2, 3], [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;])}\n&quot;)">t4_list.pk</option>
<option value="t4_for" data-src="use(&quot;list&quot;)
for (x in range(1, 4)) println(x * 10)

total := 0
for ((name, n) in [(&quot;apple&quot;, 3), (&quot;pear&quot;, 5)]) {
    put(f&quot;{name}: {n}\n&quot;)
    total = total + n
}
println(total)">t4_for.pk</option>
<option value="t4_table" data-src="use(&quot;list&quot;)
use(&quot;string&quot;)
use(&quot;table&quot;)
count := table.new()
for (w in string.split(&quot;the cat and the hat&quot;, &quot; &quot;))
    table.set(count, w, table.get(count, w, 0) + 1)
for (k in list.sort(string.string_less, table.keys(count)))
    put(f&quot;{k} {table.get(count, k, 0)}\n&quot;)

use(&quot;vector&quot;)
v := vector.new()
vector.push(v, &quot;a&quot;)
vector.push(v, &quot;b&quot;)
println(vector.len(v))
println(vector.get(v, 1))">t4_table.pk</option>
</optgroup>
<optgroup label="5. 代数的エフェクト">
<option value="t5_exception" data-src="safe_div(a, b) := if (b == 0) perform Raise{&quot;division by zero&quot;} else a / b

try(f) := handle Ok{f()} with (Raise{msg}, k) -&gt; Error{msg}

println(try(() -&gt; safe_div(10, 2)))
println(try(() -&gt; safe_div(10, 0)))
println(try(() -&gt; { put(&quot;before\n&quot;); safe_div(1, 0); put(&quot;after\n&quot;) }))">t5_exception.pk</option>
<option value="t5_generator" data-src="fun walk
walk = (Leaf{}) -&gt; none
      | (Node{l, v, r}) -&gt; { walk(l); perform Yield{v}; walk(r) }

tree := Node{Node{Leaf{}, 1, Leaf{}}, 2, Node{Leaf{}, 3, Leaf{}}}

handle walk(tree) with (Yield{v}, k) -&gt; { put(f&quot;yield {v}\n&quot;); k(none) }

to_list(t) := handle { walk(t); [] } with (Yield{v}, k) -&gt; v :: k(none)
use(&quot;pretty&quot;)
put(f&quot;{to_list(tree)}\n&quot;)">t5_generator.pk</option>
<option value="t5_choose" data-src="use(&quot;list&quot;)
use(&quot;pretty&quot;)
choose(xs) := perform Choose{xs}

all_results(f) := handle [f()] with (Choose{xs}, k) -&gt; concat_map(x -&gt; k(x), xs)

put(f&quot;{all_results(() -&gt; (choose([1, 2]), choose([&quot;a&quot;, &quot;b&quot;])))}\n&quot;)">t5_choose.pk</option>
</optgroup>
<optgroup label="6. クオートと評価器">
<option value="t6_quote" data-src="e := &#x27;(1 + 2 * x)
println(e)
x := 10
println(eval(e))

n := 5
println(`(n + !n))">t6_quote.pk</option>
<option value="t6_eval" data-src="old_eval := eval
eval = e -&gt; {
    v := old_eval(e)
    put(&quot;=&gt; &quot;)
    println(v)
    v
}
1 + 2
&#x27;(a + b)
Point{1, 2}">t6_eval.pk</option>
<option value="t6_unparse" data-src="use(&quot;unparse&quot;)
t := &#x27;(if (n &lt; 0) -n else n * (n + 1))
println(t)
put(unparse.text(t)); put(&quot;\n&quot;)">t6_unparse.pk</option>
</optgroup>
<optgroup label="7. 文法の拡張">
<option value="t7_unless" data-src="primary ::= &#x27;unless &quot;(&quot; c:expr &quot;)&quot; a:expr { `If{!c, none, !a} } | ...

unless (1 &gt; 2) put(&quot;1 &gt; 2 is false\n&quot;)
unless (1 &lt; 2) put(&quot;not printed\n&quot;)">t7_unless.pk</option>
<option value="t7_pipe" data-src="union ::= x:union &quot;|&gt;&quot; f:arrow { `Apply{!f, Tuple{!x}} } | ...

double(x) := 2 * x
3 |&gt; double |&gt; double |&gt; println">t7_pipe.pk</option>
<option value="t7_repeat" data-src="repeat_fn(n, f) := while (n &gt; 0) { f(); n = n - 1 }

primary ::= &#x27;repeat n:add_expr body:block { `repeat_fn(!n, () -&gt; !body) } | ...

repeat 3 { put(&quot;planck!\n&quot;) }">t7_repeat.pk</option>
<option value="t7_calc" data-src="calc ::= a:calc &quot;+&quot; b:term { a + b } | a:calc &quot;-&quot; b:term { a - b } | term
term ::= a:term &quot;*&quot; b:atom { a * b } | atom
atom ::= integer | &quot;(&quot; e:calc &quot;)&quot; { e }

println(calc{| 1 + 2 * (10 - 4) |})
println(calc{| 100 - 20 - 3 |})

println(peg_parse(&#x27;calc, &quot;6 * 7&quot;))
println(peg_parse(&#x27;calc, &quot;1 + )&quot;))
println(peg_parse(&#x27;calc, &quot;)&quot;))">t7_calc.pk</option>
</optgroup>
<optgroup label="8. レコード・局所関数・脱出">
<option value="t8_record" data-src="record Point(x, y) = point
p := point(3, 4)
println(p.x * p.x + p.y * p.y)

move(p, dx) := p with { x = p.x + dx }
println(move(p, 10))">t8_record.pk</option>
<option value="t8_local" data-src="parity(n) := {
    fun is_odd
    is_even(n) := if (n == 0) true else is_odd(n - 1)
    is_odd(n) = if (n == 0) false else is_even(n - 1)
    if (is_even(n)) &quot;even&quot; else &quot;odd&quot;
}
put(parity(10)); put(&quot;\n&quot;)
put(parity(7)); put(&quot;\n&quot;)">t8_local.pk</option>
<option value="t8_return" data-src="find_first(p, xs) := {
    for (x in xs) if (p(x)) return x
    none
}
println(find_first(x -&gt; x &gt; 3, [1, 5, 2, 7]))
println(find_first(x -&gt; x &gt; 9, [1, 5, 2, 7]))

n := 0
odd_sum := 0
while (true) {
    n = n + 1
    if (n &gt; 10) break
    if (n % 2 == 0) continue
    odd_sum = odd_sum + n
}
println(odd_sum)">t8_return.pk</option>
</optgroup>
<optgroup label="9. 変数の範囲">
<option value="t1_scope" data-src="n := 5
read_n() := n
caller() := {
    n := 100
    read_n()
}
println(caller())

x := 1
get() := x
x := x + 1
println(Tuple{x, get()})
x = 10
println(Tuple{x, get()})">t1_scope.pk</option>
<option value="e_undefined" data-src="println(&quot;start&quot;)
println(later)
later := 2">e_undefined.pk</option>
</optgroup>
<optgroup label="10. 添字と置き換え">
<option value="t9_index" data-src="use(&quot;table&quot;)
a := array(3)
a[0] = 10
a[1] = a[0] + 5
a[2] = a[1] * 2
println(a[2])
s := &quot;planck&quot;
println(s[1])
t := table.new()
t[&#x27;x] = 1
t[&#x27;y] = 2
println(t[&#x27;x] + t[&#x27;y])
println(t[&#x27;z])
xs := [10, 20, 30]
println(xs[1])">t9_index.pk</option>
<option value="t9_kind" data-src="use(&quot;table&quot;)
_index_get = (Counts{t}, k) -&gt; table.get(t, k, 0) | _index_get
_index_set = (Counts{t}, k, n) -&gt; table.set(t, k, n) | _index_set
c := Counts{table.new()}
for (w in [&quot;a&quot;, &quot;b&quot;, &quot;a&quot;, &quot;a&quot;]) c[w] = c[w] + 1
println(c[&quot;a&quot;])
println(c[&quot;b&quot;])
println(c[&quot;z&quot;])">t9_kind.pk</option>
<option value="t9_rewrite" data-src="use(&quot;unparse&quot;)
step(e) := e[
    Apply{&#x27;_add, Tuple{a @ Int, b @ Int}} -&gt; a + b
  | Apply{&#x27;_mul, Tuple{a @ Int, b @ Int}} -&gt; a * b
  | Apply{&#x27;_add, Tuple{a, 0}} -&gt; a
  | Apply{&#x27;_mul, Tuple{a, 1}} -&gt; a
]
simplify(e) := {
    println(unparse.text(e))
    n := step(e)
    while (n != e) {
        e = n
        println(unparse.text(e))
        n = step(e)
    }
    e
}
simplify(&#x27;(x * 1 + (2 + 3) * 4 + 0))">t9_rewrite.pk</option>
</optgroup>
