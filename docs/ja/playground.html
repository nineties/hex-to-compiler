<textarea id="pg-src" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">fib(n) := if (n &lt; 2) n else fib(n - 1) + fib(n - 2)

put("Hello, world!\n")
</textarea>
<p><button type="button" id="pg-run" class="run">実行</button></p>
