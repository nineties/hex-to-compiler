<option value="t1_scope" data-src="n := 5

<option value="t2_mexpr" data-src="p := Point{3, 4}

<option value="t3_fib" data-src="fun fib
fib = (0) -&gt; 0
     | (1) -&gt; 1
     | (n) -&gt; fib(n - 1) + fib(n - 2)
print(fib(20))">fib</option>
<option value="t3_fib_lines" data-src="fib(0) := 0
fib(1) = 1
fib(n) = fib(n - 1) + fib(n - 2)
print(fib(20))">fib (clauses)</option>
<option value="t3_list" data-src="fun len
len = (Nil{}) -&gt; 0 | (_ :: xs) -&gt; 1 + len(xs)
print(len([5, 6, 7]))

fun sum
sum = ([]) -&gt; 0 | (x :: xs) -&gt; x + sum(xs)
print(sum([1, 2, 3, 4]))

swap2 := ([a, b]) -&gt; [b, a] | (xs) -&gt; xs
use(&quot;pretty&quot;)
print(f&quot;{swap2([1, 2])} {swap2([1, 2, 3])}&quot;)">list patterns</option>
<option value="t3_match" data-src="classify(n) := match n {
    0 -&gt; &quot;zero&quot;
  | n if n &lt; 0 -&gt; &quot;negative&quot;
  | n if n % 2 == 0 -&gt; &quot;even&quot;
  | _ -&gt; &quot;odd&quot;
}
print(classify(0)); print(&quot; &quot;)
print(classify(-4)); print(&quot; &quot;)
print(classify(6)); print(&quot; &quot;)
print(classify(7))">match</option>
<option value="t3_extend" data-src="greet := (_) -&gt; &quot;hello&quot;
print(greet(&quot;en&quot;))

greet = (&quot;fr&quot;) -&gt; &quot;bonjour&quot; | greet
print(greet(&quot;fr&quot;))
print(greet(&quot;de&quot;))">extending a function</option>
<option value="t3_deriv" data-src="fun d
d = (n @ Int, x) -&gt; 0
   | (y @ Symbol, x) -&gt; if (y == x) 1 else 0
   | (Add{a, b}, x) -&gt; Add{d(a, x), d(b, x)}
   | (Mul{a, b}, x) -&gt; Add{Mul{d(a, x), b}, Mul{a, d(b, x)}}

print(d(&#x27;Add{x, 3}, &#x27;x))
print(d(&#x27;Mul{x, y}, &#x27;x))">derivative</option>
<option value="t4_list" data-src="use(&quot;list&quot;)
use(&quot;pretty&quot;)
xs := range(1, 11)
print(f&quot;{xs}&quot;)
print(f&quot;{map(x -&gt; x * x, xs)}&quot;)
print(f&quot;{filter(x -&gt; x % 2 == 0, xs)}&quot;)
print(foldl((a, b) -&gt; a + b, 0, xs))
print(f&quot;{list.sort((a, b) -&gt; a &lt; b, [5, 3, 9, 1])}&quot;)
print(f&quot;{list.zip([1, 2, 3], [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;])}&quot;)">list library</option>
<option value="t4_for" data-src="use(&quot;list&quot;)
for (x in range(1, 4)) print(x * 10)

total := 0
for ((name, n) in [(&quot;apple&quot;, 3), (&quot;pear&quot;, 5)]) {
    print(f&quot;{name}: {n}&quot;)
    total = total + n
}
print(total)">for loop</option>
<option value="t4_table.0" data-src="use(&quot;list&quot;)
use(&quot;string&quot;)
use(&quot;table&quot;)
count := table.new()
for (w in string.split(&quot;the cat and the hat&quot;, &quot; &quot;))
    table.set(count, w, table.get(count, w, 0) + 1)
for (k in list.sort(string.string_less, table.keys(count)))
    print(f&quot;{k} {table.get(count, k, 0)}&quot;)">table</option>
<option value="t4_table.1" data-src="use(&quot;vector&quot;)
v := vector.new()
vector.push(v, &quot;a&quot;)
vector.push(v, &quot;b&quot;)
print(vector.len(v))
print(vector.get(v, 1))">vector</option>
<option value="t5_exception" data-src="safe_div(a, b) := if (b == 0) perform Raise{&quot;division by zero&quot;} else a / b

try(f) := handle Ok{f()} with (Raise{msg}, k) -&gt; Error{msg}

print(try(() -&gt; safe_div(10, 2)))
print(try(() -&gt; safe_div(10, 0)))
print(try(() -&gt; { print(&quot;before\n&quot;); safe_div(1, 0); print(&quot;after\n&quot;) }))">exception</option>
<option value="t5_generator" data-src="fun walk
walk = (Leaf{}) -&gt; none
      | (Node{l, v, r}) -&gt; { walk(l); perform Yield{v}; walk(r) }

tree := Node{Node{Leaf{}, 1, Leaf{}}, 2, Node{Leaf{}, 3, Leaf{}}}

handle walk(tree) with (Yield{v}, k) -&gt; { print(f&quot;yield {v}&quot;); k(none) }

to_list(t) := handle { walk(t); [] } with (Yield{v}, k) -&gt; v :: k(none)
use(&quot;pretty&quot;)
print(f&quot;{to_list(tree)}&quot;)">generator</option>
<option value="t5_choose" data-src="use(&quot;list&quot;)
use(&quot;pretty&quot;)
choose(xs) := perform Choose{xs}

all_results(f) := handle [f()] with (Choose{xs}, k) -&gt; concat_map(x -&gt; k(x), xs)

print(f&quot;{all_results(() -&gt; (choose([1, 2]), choose([&quot;a&quot;, &quot;b&quot;])))}&quot;)">nondeterminism</option>
<option value="t6_quote.0" data-src="e := &#x27;(1 + 2 * x)

x := 10
print(eval(e))">quote and eval</option>
<option value="t6_quote.1" data-src="n := 5
print(`(n + !n))">quasi-quote</option>
<option value="t6_eval" data-src="old_eval := eval
eval = e -&gt; {
    v := old_eval(e)
    print(f&quot;=&gt; {v}&quot;)
    v
}
1 + 2
&#x27;(a + b)
Point{1, 2}">custom eval</option>
<option value="t6_unparse" data-src="use(&quot;unparse&quot;)
t := &#x27;(if (n &lt; 0) -n else n * (n + 1))
print(t)
print(unparse.text(t))">unparse</option>
<option value="t7_unless" data-src="primary ::= &#x27;unless &quot;(&quot; c:expr &quot;)&quot; a:expr { `If{!c, none, !a} } | ...

unless (1 &gt; 2) print(&quot;1 &gt; 2 is false&quot;)
unless (1 &lt; 2) print(&quot;not printed&quot;)">unless</option>
<option value="t7_pipe" data-src="union ::= x:union &quot;|&gt;&quot; f:arrow { `Apply{!f, Tuple{!x}} } | ...

double(x) := 2 * x
3 |&gt; double |&gt; double |&gt; print">pipe operator</option>
<option value="t7_repeat" data-src="repeat_fn(n, f) := while (n &gt; 0) { f(); n = n - 1 }

primary ::= &#x27;repeat n:add_expr body:block { `repeat_fn(!n, () -&gt; !body) } | ...

repeat 3 { print(&quot;planck!&quot;) }">repeat</option>
<option value="t7_calc" data-src="calc ::= a:calc &quot;+&quot; b:term { a + b } | a:calc &quot;-&quot; b:term { a - b } | term
term ::= a:term &quot;*&quot; b:atom { a * b } | atom
atom ::= integer | &quot;(&quot; e:calc &quot;)&quot; { e }

print(calc{| 1 + 2 * (10 - 4) |})
print(calc{| 100 - 20 - 3 |})

print(peg_parse(&#x27;calc, &quot;6 * 7&quot;))
print(peg_parse(&#x27;calc, &quot;1 + )&quot;))
print(peg_parse(&#x27;calc, &quot;)&quot;))">calculator grammar</option>
<option value="t8_record" data-src="record Point(x, y) = point
p := point(3, 4)
print(p.x * p.x + p.y * p.y)

move(p, dx) := p with { x = p.x + dx }
print(move(p, 10))">record</option>
<option value="t8_local" data-src="parity(n) := {
    fun is_odd
    is_even(n) := if (n == 0) true else is_odd(n - 1)
    is_odd(n) = if (n == 0) false else is_even(n - 1)
    if (is_even(n)) &quot;even&quot; else &quot;odd&quot;
}
print(parity(10))
print(parity(7))">local functions</option>
<option value="t8_return.0" data-src="find_first(p, xs) := {
    for (x in xs) if (p(x)) return x
    none
}
print(find_first(x -&gt; x &gt; 3, [1, 5, 2, 7]))
print(find_first(x -&gt; x &gt; 9, [1, 5, 2, 7]))">early return</option>
<option value="t8_return.1" data-src="n := 0
odd_sum := 0
while (true) {
    n = n + 1
    if (n &gt; 10) break
    if (n % 2 == 0) continue
    odd_sum = odd_sum + n
}
print(odd_sum)">break and continue</option>
<option value="t9_index" data-src="use(&quot;table&quot;)
a := array(3)
a[0] = 10
a[1] = a[0] + 5
a[2] = a[1] * 2
print(a[2])
s := &quot;planck&quot;
print(s[1])
t := table.new()
t[&#x27;x] = 1
t[&#x27;y] = 2
print(t[&#x27;x] + t[&#x27;y])
print(t[&#x27;z])
xs := [10, 20, 30]
print(xs[1])">indexing</option>
<option value="t9_kind" data-src="use(&quot;table&quot;)
_index_get = (Counts{t}, k) -&gt; table.get(t, k, 0) | _index_get
_index_set = (Counts{t}, k, n) -&gt; table.set(t, k, n) | _index_set
c := Counts{table.new()}
for (w in [&quot;a&quot;, &quot;b&quot;, &quot;a&quot;, &quot;a&quot;]) c[w] = c[w] + 1
print(c[&quot;a&quot;])
print(c[&quot;b&quot;])
print(c[&quot;z&quot;])">custom index</option>
<option value="t9_rewrite" data-src="use(&quot;unparse&quot;)
step(e) := e[
    Apply{&#x27;_add, Tuple{a @ Int, b @ Int}} -&gt; a + b
  | Apply{&#x27;_mul, Tuple{a @ Int, b @ Int}} -&gt; a * b
  | Apply{&#x27;_add, Tuple{a, 0}} -&gt; a
  | Apply{&#x27;_mul, Tuple{a, 1}} -&gt; a
]
simplify(e) := {
    print(unparse.text(e))
    n := step(e)
    while (n != e) {
        e = n
        print(unparse.text(e))
        n = step(e)
    }
    e
}
simplify(&#x27;(x * 1 + (2 + 3) * 4 + 0))">rewrite rules</option>
