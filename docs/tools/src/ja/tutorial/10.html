<!--title 10. 添字と置き換え-->
<h1>10. 添字と置き換え</h1>
<p class="lead"><code>a[i]</code> と <code>a[i] = v</code> は <code>_index_get</code> と <code>_index_set</code> の呼び出しです。種類ごとの関数を <code>|</code> でつないだものなので、利用者が自分の種類を足せます。</p>

<!--ex t9_index-->
<p>文字列・リスト・組・M式は不変で、書き込むとプログラムが止まります。</p>

<h2>種類の追加</h2>
<!--ex t9_kind-->
<p>融合の先頭に自分の種類を置き、残りは元の関数に回します。</p>

<h2>木の書き換え</h2>
<!--ex t9_rewrite-->
<p><code>t[p -&gt; a | q -&gt; b]</code> は <code>subst(t, ...)</code> で、木の各部分を根から順に試し、合えば置き換えて内側は試しません。変わらなくなるまで繰り返します。</p>
