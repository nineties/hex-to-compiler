<h1>8. レコード・局所関数・脱出</h1>
<p class="lead"><code>record</code> は M式の引数に名前を付ける宣言です。<code>return</code>・<code>break</code>・<code>continue</code> は<a href="5.html">5章</a>のエフェクトとして実装されています。</p>

<!--ex t8_record-->
<p>値は <code>Point{3, 4}</code> のままで、パターンでも分解できます。</p>

<h2>局所関数と脱出</h2>
<!--ex t8_local-->
<p>互いに呼び合う関数は、先に <code>fun f</code> で名前を宣言し、あとで <code>f(x) = ...</code> で埋めます（<a href="../reference/closures.html#scope">変数の範囲</a>）。</p>
<!--ex t8_return-->
<p><code>for</code> の本体は関数ですが、その中の <code>return</code> は外の関数から抜けます。<code>break</code>・<code>continue</code> の対象は一番内側の <code>while</code> か <code>for</code> です。</p>
