<!--title 1. 式・束縛・関数-->
<h1>1. 式・束縛・関数</h1>
<p class="lead">文はなく、<code>if</code>・<code>while</code>・ブロックも式です。値を返す式を組み合わせて書きます。</p>

<!--ex t1_hello-->
<!--ex t1_vars-->
<!--ex t1_func-->
<ul>
<li><code>:=</code> は定義、<code>=</code> は既存の変数への代入です。関数の中で <code>:=</code> した変数は外から見えません（<a href="../reference/syntax.html#scope">変数の範囲</a>）。</li>
<li>偽は <code>false</code> だけです。<code>0</code> も <code>none</code> も真です。</li>
<li>関数名と <code>(</code> の間に空白は置けません。</li>
</ul>

<h2>ブロックと閉包</h2>
<!--ex t1_rec-->
<p><code>{ ... }</code> は最後の式の値を返します。関数は閉包で、捕らえた変数を書き換えられます。</p>
