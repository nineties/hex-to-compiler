<!--title 4. ライブラリ-->
<h1>4. ライブラリ</h1>
<p class="lead"><code>planck/lib</code> のライブラリも planck の構文で書かれていて、<code>use("name")</code> で読み込みます。一覧は<a href="../library/index.html">ライブラリ</a>にあります。</p>

<!--ex t4_list-->
<p>演算子は関数として渡せないので、<code>(a, b) -&gt; a + b</code> のように無名関数で書きます。</p>
<!--ex t4_for-->
<p><code>for (p in xs) body</code> はリストかベクタの要素をパターン <code>p</code> に当てます。</p>
<!--ex t4_table-->
<p>表とベクタは <code>t[key]</code>・<code>v[i]</code> でも読み書きできます（<a href="10.html">10章</a>）。</p>
