<h1>2. 値と M式</h1>
<p class="lead">データ構造もプログラムも M式 <code>Head{a, ...}</code> で表します。宣言なしに作れ、<code>==</code> は構造で比べます。</p>

<!--ex t2_mexpr-->
<p>文字列の長さと位置はバイト単位です。リストは <code>Cons</code> と <code>Nil</code>、組は <code>Tuple</code> の M式で、<code>[1, 2]</code> や <code>(a, b)</code> はその書き方です。</p>
<!--ex t2_lists-->
<p>値の種類は<a href="../reference/core.html">データモデル</a>にあります。</p>
