<!--title 9. 変数の範囲-->
<h1>9. 変数の範囲</h1>
<p class="lead">名前がどの変数を指すかは、書かれた位置から式の実行前に決まります。呼んだ側の変数は見えません。</p>

<!--ex t1_scope-->
<p><code>read_n()</code> は <code>caller</code> の中の <code>n</code> ではなく、トップレベルの <code>n</code> を読みます。同じ名前を <code>:=</code> でもう一度定義すると新しい変数ができ、前に作った関数は前の変数を指したままです。</p>

<h2>どの変数も指さない名前</h2>
<!--ex e_undefined-->
<p>その式を実行する前にプログラムが止まります。<code>later</code> は3行目で定義されていて、2行目からは見えません。</p>

<p>関数に定義を足すか隠すかは<a href="3.html">3章</a>。</p>
