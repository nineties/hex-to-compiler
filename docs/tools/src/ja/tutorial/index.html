<h1>planck チュートリアル</h1>
<p class="lead">planck は記号処理と言語処理のための言語です。式は M式に読み替えて評価され、構文も packrat パーサの規則としてプログラムから拡張できます。各章は例を1つ動かして考え方を見せます。出力はすべて planck0 の実行結果で、定義は<a href="../reference/index.html">リファレンス</a>にあります。</p>

<h2>実行</h2>
<!--text tutorial_run-->
<p>リポジトリの最上位で実行します。REPL はなく、引数は <code>argv()</code> で受け取ります。</p>
