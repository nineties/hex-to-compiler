<h1>planck チュートリアル</h1>
<p class="lead">planck は記号処理と言語処理のための言語です。式は M式に読み替えて評価され、構文も packrat パーサの規則としてプログラムから拡張できます。各章は例を1つ動かして考え方を見せます。定義は<a href="../reference/index.html">リファレンス</a>にあります。</p>

<h2>実行</h2>
<p>各章の例の「実行」ボタンは、ブラウザの中で PlanckVM を動かして出力を表示します。<a href="../playground.html">Playground</a> は、式を1つずつ入力して値を確かめる REPL です。</p>
