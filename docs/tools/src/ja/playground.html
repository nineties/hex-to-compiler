<!--title Playground-->
<h1>Playground</h1>
<div id="playground">
<div class="pg-tabs" role="tablist" aria-label="Playground のタブ">
<button type="button" role="tab" id="pg-tab-repl" aria-controls="pg-repl" aria-selected="true">REPL</button>
<button type="button" role="tab" id="pg-tab-run" aria-controls="pg-run" aria-selected="false" tabindex="-1">コードの実行</button>
</div>
<div class="pg-panel" id="pg-repl" role="tabpanel" aria-labelledby="pg-tab-repl">
<pre class="repl" id="pg-log"></pre>
<div class="pg-line"><span class="prompt">&gt; </span><textarea id="pg-in" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="input"></textarea></div>
</div>
<div class="pg-panel" id="pg-run" role="tabpanel" aria-labelledby="pg-tab-run" hidden>
<div class="pg-bar">
<select id="pg-sample" aria-label="サンプル">
<option value="">サンプル</option>
<!--samples-->
</select>
<button type="button" class="run" id="pg-go">実行</button>
</div>
<textarea id="pg-code" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="プログラム"></textarea>
<p class="label" id="pg-out-label" hidden>出力</p>
<pre class="out run-out" id="pg-out" hidden></pre>
</div>
</div>
