<!--title Playground-->
<h1>Playground</h1>
<p class="lead">planck のコードをブラウザで実行します。</p>
<div id="playground">
<p><select id="pg-mode" aria-label="mode">
<option value="repl">REPL の形で表示する</option>
<option value="run">プログラムとして実行する</option>
</select></p>
<textarea id="pg-src" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">fib(n) := if (n &lt; 2) n else fib(n - 1) + fib(n - 2)
fib(20)
put("Hello, world!\n")
</textarea>
<p><button type="button" id="pg-run" class="run">実行</button></p>
<p class="label">出力</p>
<pre class="out" id="pg-out"></pre>
</div>
