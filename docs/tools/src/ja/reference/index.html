<h1>リファレンス</h1>
<p class="lead">planck は記号処理と言語処理のための言語です。この節で言語を定義します。</p>

<h2>プログラムの読み込み</h2>
<p>処理系は <code>planck/init.pk</code> を読み込んでから、第1引数のプログラムファイルのトップレベルの式を1つずつ読んで評価します。<code>planck/syntax.pk</code> は <code>planck/peg.pk</code> の packrat パーサで<a href="syntax.html">構文</a>を定義します。まず M式で <code>::=</code> の文法と動作の最小の構文までを書き、そこで <code>parse</code> を差し替え、残りを <code>::=</code> で宣言します。引数のファイルはこの構文で読みます。</p>
