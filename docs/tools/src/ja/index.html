<h1>hex-to-compiler project</h1>
<p class="lead">16進で手書きした機械語から、言語処理系をブートストラップするプロジェクトです。各ステージは前のステージの成果物だけを使い、外部のアセンブラ・コンパイラ・ランタイムを使いません。</p>

<h2>ブートストラップのステージ</h2>
<p>図の色は成果物を記述した言語です。作り方は<a href="implementation/index.html">処理系の実装</a>、言語の定義は<a href="reference/index.html">リファレンス</a>にあります。</p>
