name: bench

on:
    workflow_dispatch:
    push:
        branches: "bench"
jobs:
    bench:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: measure
              run:
                  sh tools/bench.sh 5
            - name: summary
              run:
                  cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"
            - name: upload raw values
              uses: actions/upload-artifact@v4
              with:
                  name: bench-out
                  path: bench-out/
