name: release

on:
    push:
        tags: ["v*"]
permissions:
    contents: write
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: embed the version
              run: sed -i "s/(return \"dev\")/(return \"${GITHUB_REF_NAME#v}\")/" bootstrap/planck0.sv
            - name: cache plisp2
              id: plisp2-cache
              uses: actions/cache@v4
              with:
                  path: |
                      pforth
                      plisp2
                  key: plisp2-${{ runner.os }}-${{ hashFiles('Makefile', 'bootstrap/pforth.xxd', 'bootstrap/plisp.fs', 'bootstrap/plisp2.sv', 'bootstrap/asm.lisp', 'bootstrap/asm/*.lisp', 'bootstrap/sasm.lisp', 'bootstrap/sasm/*.lisp', 'bootstrap/sasm/lib/*.sv') }}
            - name: mark cached plisp2 up to date
              if: steps.plisp2-cache.outputs.cache-hit == 'true'
              run: touch pforth plisp2
            - name: build planck0
              run: make planck0
            - name: test planck0
              run: make test-planck0
            - name: publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  sha256sum planck0 > planck0.sha256
                  gh release create "$GITHUB_REF_NAME" planck0 planck0.sha256 --title "$GITHUB_REF_NAME" --generate-notes
