name: lint

on:
    push:
        branches: ["**"]
    workflow_dispatch:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: lint
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  if [ "$GITHUB_REF" = refs/heads/main ] && [ "$EVENT" = push ]; then
                      export LINT_BASE=$BEFORE
                  fi
                  sh tools/lint.sh
