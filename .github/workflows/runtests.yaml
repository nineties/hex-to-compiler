name: run tests

on:
    push:
        branches: ["**"]
        paths-ignore: ["README.rst", "LICENSE", ".gitignore"]
    workflow_dispatch:
jobs:
    runtests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v1
            - name: build pforth
              run:
                  make pforth
            - name: test plisp
              if: github.ref != 'refs/heads/main'
              run:
                  ./pforth < plisp.fs plisp/test.lisp
            - name: restore plisp2
              id: plisp2-cache
              uses: actions/cache/restore@v6.1.0
              with:
                  path: plisp2
                  key: plisp2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'pforth.xxd', 'plisp.fs', 'plisp2.sv', 'asm.lisp', 'asm/*.lisp', 'sasm.lisp', 'sasm/*.lisp', 'sasm/lib/*.sv') }}
            - name: use cached plisp2
              if: steps.plisp2-cache.outputs.cache-hit == 'true'
              run:
                  touch plisp2
            - name: build plisp2
              if: steps.plisp2-cache.outputs.cache-hit != 'true'
              run:
                  make plisp2
            - name: save plisp2
              if: steps.plisp2-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6.1.0
              with:
                  path: plisp2
                  key: ${{ steps.plisp2-cache.outputs.cache-primary-key }}
            - name: test plisp2
              if: github.ref != 'refs/heads/main'
              run:
                  ./plisp2 plisp/test.lisp
            - name: build planck0
              if: github.ref != 'refs/heads/main'
              run:
                  make planck0
            - name: test planck0
              if: github.ref != 'refs/heads/main'
              run:
                  make test-planck0
