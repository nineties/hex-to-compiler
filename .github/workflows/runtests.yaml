name: run tests

on:
    pull_request:
    workflow_dispatch:
jobs:
    runtests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: build pforth
              run: make pforth
            - name: test plisp
              run: ./pforth < bootstrap/plisp.fs bootstrap/plisp/test.lisp
            - name: cache plisp2
              id: plisp2-cache
              uses: actions/cache@v4
              with:
                  path: |
                      pforth
                      plisp2
                  key: plisp2-${{ runner.os }}-${{ hashFiles('Makefile', 'bootstrap/pforth.xxd', 'bootstrap/plisp.fs', 'bootstrap/plisp2.sv', 'bootstrap/asm.lisp', 'bootstrap/asm/*.lisp', 'bootstrap/sasm.lisp', 'bootstrap/sasm/*.lisp', 'bootstrap/sasm/lib/*.sv') }}
            - name: mark cached plisp2 up to date
              if: steps.plisp2-cache.outputs.cache-hit == 'true'
              run: touch pforth plisp2
            - name: build plisp2
              if: steps.plisp2-cache.outputs.cache-hit != 'true'
              run: make plisp2
            - name: test plisp2
              run: ./plisp2 bootstrap/plisp/test.lisp
            - name: build planck0
              run: make planck0
            - name: test planck0
              run: make test-planck0
