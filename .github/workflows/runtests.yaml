name: run tests

on:
    push:
        branches: ["**"]
    workflow_dispatch:
jobs:
    runtests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: build pforth
              run: make pforth
            - name: test plisp
              run: ./pforth < bootstrap/plisp.fs bootstrap/plisp/test.lisp
            - name: build plisp2
              run: make plisp2
            - name: test plisp2
              run: ./plisp2 bootstrap/plisp/test.lisp
            - name: build planck0
              run: make planck0
            - name: test planck0
              run: make test-planck0
