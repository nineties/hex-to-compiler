name: run tests

on:
    push:
        branches: ["**"]
        paths-ignore: ["README.rst", "LICENSE", ".gitignore", "docs/**", "planck/SPEC.rst"]
    workflow_dispatch:
jobs:
    runtests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v1
            - name: build pforth
              run:
                  make pforth
            - name: test plisp
              if: github.ref != 'refs/heads/main'
              run:
                  ./pforth < bootstrap/plisp.fs bootstrap/plisp/test.lisp
            - name: restore plisp2
              id: plisp2-cache
              uses: actions/cache/restore@v6.1.0
              with:
                  path: plisp2
                  key: plisp2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'bootstrap/**', '!bootstrap/planck0.sv') }}
            - name: use cached plisp2
              if: steps.plisp2-cache.outputs.cache-hit == 'true'
              run:
                  touch plisp2
            - name: build plisp2
              if: steps.plisp2-cache.outputs.cache-hit != 'true'
              run:
                  make plisp2
            - name: save plisp2
              if: steps.plisp2-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6.1.0
              with:
                  path: plisp2
                  key: ${{ steps.plisp2-cache.outputs.cache-primary-key }}
            - name: test plisp2
              if: github.ref != 'refs/heads/main'
              run:
                  ./plisp2 bootstrap/plisp/test.lisp
            - name: restore planck0
              id: planck0-cache
              uses: actions/cache/restore@v6.1.0
              with:
                  path: planck0
                  key: planck0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'bootstrap/**') }}
            - name: use cached planck0
              if: steps.planck0-cache.outputs.cache-hit == 'true'
              run:
                  touch planck0
            - name: build planck0
              if: steps.planck0-cache.outputs.cache-hit != 'true'
              run:
                  make planck0
            - name: save planck0
              if: steps.planck0-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6.1.0
              with:
                  path: planck0
                  key: ${{ steps.planck0-cache.outputs.cache-primary-key }}
            - name: restore the mark of passed test planck0
              id: planck0-test-cache
              if: github.ref != 'refs/heads/main'
              uses: actions/cache/restore@v6.1.0
              with:
                  path: tmp-test-planck0-passed
                  key: test-${{ steps.planck0-cache.outputs.cache-primary-key }}-${{ hashFiles('Makefile', 'planck/**', '!planck/SPEC.rst', 'tools/**') }}
            - name: test planck0
              if: github.ref != 'refs/heads/main' && steps.planck0-test-cache.outputs.cache-hit != 'true'
              run:
                  make test-planck0
            - name: test the evaluator written in Planck
              if: github.ref != 'refs/heads/main' && steps.planck0-test-cache.outputs.cache-hit != 'true'
              run:
                  make test-interp
            - name: make the mark of passed test planck0
              if: github.ref != 'refs/heads/main' && steps.planck0-test-cache.outputs.cache-hit != 'true'
              run:
                  touch tmp-test-planck0-passed
            - name: save the mark
              if: github.ref != 'refs/heads/main' && steps.planck0-test-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6.1.0
              with:
                  path: tmp-test-planck0-passed
                  key: ${{ steps.planck0-test-cache.outputs.cache-primary-key }}
